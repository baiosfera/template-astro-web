name: Deploy Production to Zerops

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.repository != 'baiosfera/template-astro-web' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Zerops Production Service
        uses: zeropsio/actions@v1.0.2
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_PROD_SERVICE_ID || secrets.ZEROPS_SERVICE_ID }}
