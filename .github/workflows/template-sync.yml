name: Sync from Upstream Template

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: ${{ github.repository != 'baiosfera/template-astro-web' }}
    runs-on: ubuntu-latest
    steps:
      - uses: AndreasAugustin/actions-template-sync@v2
        with:
          source_repo_path: baiosfera/template-astro-web
          upstream_branch: main
          pr_title: "chore(template): sync upstream template-astro-web improvements"
          pr_commit_msg: "chore(template): sync upstream template-astro-web"
